[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kmerOpt"
version = "0.3.0"
description = "K-mer selection, annotation, and interpretation for GWAS"
readme = "README.md"
license = "MIT"
authors = [{name = "Shifan"}]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.21",
    "pandas>=1.3",
    "scipy>=1.7",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
]
keywords = ["k-mer", "GWAS", "heritability", "LD pruning", "annotation", "genomics", "plant breeding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
]

[project.scripts]
kmeropt = "kmerOpt.cli:main"

[project.urls]
Homepage = "https://github.com/undefaned/kmerOpt"
Repository = "https://github.com/undefaned/kmerOpt"
Issues = "https://github.com/undefaned/kmerOpt/issues"

[tool.setuptools.packages.find]
include = ["kmerOpt*"]
